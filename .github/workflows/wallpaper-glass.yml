name: Web wallpaper glass skin

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/wallpaper.css'
      - 'tests/wallpaper-glass.test.cjs'
      - '.github/workflows/wallpaper-glass.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/wallpaper.css'
      - 'tests/wallpaper-glass.test.cjs'
      - '.github/workflows/wallpaper-glass.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify translucent wallpaper skin
        run: node tests/wallpaper-glass.test.cjs
