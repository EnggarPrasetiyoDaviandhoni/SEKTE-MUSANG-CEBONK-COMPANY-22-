name: ASTROLOGI UTC-only regression
on:
  push:
    paths:
      - 'index.html'
      - 'tests/astrology-utc-only.test.cjs'
      - '.github/workflows/astrology-utc-only.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/astrology-utc-only.test.cjs'
      - '.github/workflows/astrology-utc-only.yml'
  workflow_dispatch:
jobs:
  utc-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ASTROLOGI UTC conversion and preserve Al-Biruni WIB
        run: node tests/astrology-utc-only.test.cjs
