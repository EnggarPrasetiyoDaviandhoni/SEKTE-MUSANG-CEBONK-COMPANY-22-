name: IPDA Yahoo D1
on:
  workflow_dispatch:
  schedule:
    - cron: '20 1 * * 1-5'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch Yahoo gold candles
        run: python scripts/ipda_yahoo_d1.py
      - name: Publish feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ipda/yahoo-gold-d1.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update Yahoo gold D1 feed'
            git push
          fi
