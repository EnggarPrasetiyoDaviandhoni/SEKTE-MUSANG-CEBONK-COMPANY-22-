name: MT5 official calendar transport diagnostic
on:
  push:
    branches: [codex/isolated-mt5-https-feeds-20261019]
    paths: ['.github/workflows/mt5-calendar-access-diagnostics.yml']
permissions:
  contents: read
jobs:
  official-calendar-access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check official New York Fed monthly calendars without publishing
        run: |
          python3 - <<'PY'
          import concurrent.futures, json, urllib.error, urllib.request
          urls = [
            'https://www.newyorkfed.org/research/calendars/i-oct26.html',
            'https://www.newyorkfed.org/research/calendars/i-nov26.html',
          ]
          def check(url):
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'Cebonk-MT5-Calendar-Audit/1.0', 'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      raw = response.read(4000001)
                      return {'url': url, 'status': response.status, 'content_type': response.headers.get('Content-Type'), 'bytes': len(raw), 'contains_employment_release': b'Employment Situation' in raw}
              except urllib.error.HTTPError as error:
                  return {'url': url, 'status': error.code}
              except Exception as error:
                  return {'url': url, 'error': str(error)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              print(json.dumps(list(pool.map(check, urls)), indent=2))
          PY
