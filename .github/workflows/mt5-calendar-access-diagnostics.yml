name: MT5 official calendar transport diagnostic
on:
  push:
    branches: [codex/isolated-mt5-https-feeds-20261019]
    paths: ['.github/workflows/mt5-calendar-access-diagnostics.yml']
permissions:
  contents: read
jobs:
  official-calendar-access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check documented public agency calendar endpoints without publishing
        run: |
          python3 - <<'PY'
          import concurrent.futures, datetime, json, urllib.error, urllib.request
          now = datetime.datetime.now(datetime.timezone.utc)
          urls = [
            f'https://www.bls.gov/schedule/{now.year}/{now.month:02d}_sched.htm',
            'https://www.bls.gov/schedule/news_release/bls.ics',
            f'https://www.federalreserve.gov/newsevents/{now.year}-{now.strftime("%B").lower()}.htm',
            'https://www.bea.gov/news/schedule',
          ]
          def check(url):
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'Cebonk-MT5-Calendar-Audit/1.0', 'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      response.read(100)
                      return {'url': url, 'status': response.status, 'content_type': response.headers.get('Content-Type')}
              except urllib.error.HTTPError as error:
                  return {'url': url, 'status': error.code}
              except Exception as error:
                  return {'url': url, 'error': str(error)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              print(json.dumps(list(pool.map(check, urls)), indent=2))
          PY
