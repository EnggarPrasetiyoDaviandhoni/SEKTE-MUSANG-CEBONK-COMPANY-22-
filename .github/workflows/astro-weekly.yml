name: Astrology weekly Monday-Friday validation
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/astro-weekly-core.js'
      - 'assets/astro-weekly-ui.js'
      - 'tests/astro-weekly.test.cjs'
      - '.github/workflows/astro-weekly.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/astro-weekly-core.js'
      - 'assets/astro-weekly-ui.js'
      - 'tests/astro-weekly.test.cjs'
      - '.github/workflows/astro-weekly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check assets/astro-weekly-core.js
          node --check assets/astro-weekly-ui.js
      - name: Weekday aggregation and WIB timing regression
        run: node tests/astro-weekly.test.cjs
