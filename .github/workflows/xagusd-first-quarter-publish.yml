name: Publish First Quarter XAGUSD moon feed (auto)
on:
  schedule:
    # Daily 01:35 UTC; independent of browser visits and MT5 terminals.
    - cron: '35 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-xagusd-first-quarter.mjs'
      - 'tests/xagusd-first-quarter-feed.test.mjs'
      - '.github/workflows/xagusd-first-quarter-publish.yml'
  pull_request:
    paths:
      - 'scripts/generate-xagusd-first-quarter.mjs'
      - 'tests/xagusd-first-quarter-feed.test.mjs'
      - '.github/workflows/xagusd-first-quarter-publish.yml'
permissions:
  contents: write
concurrency:
  group: xagusd-first-quarter-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching browser ephemeris
        run: npm install --no-save --no-package-lock --ignore-scripts astronomy-engine@2.1.19
      - name: Validate input and publishing script
        run: |
          node --check scripts/generate-xagusd-first-quarter.mjs
          node tests/xagusd-first-quarter-feed.test.mjs
      - name: Generate official lunar timing
        run: node scripts/generate-xagusd-first-quarter.mjs
      - name: Publish JSON consumed directly by MT5
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ea/xagusd_first_quarter/data/first_quarters.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh first-quarter XAGUSD moon feed [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Moon feed unchanged."
          fi
