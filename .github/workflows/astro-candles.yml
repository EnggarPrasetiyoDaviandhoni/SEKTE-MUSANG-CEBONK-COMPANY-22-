name: Astrology H1 H4 candle summaries

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/astro-candles.js'
      - 'tests/astro-candles*.cjs'
      - '.github/workflows/astro-candles.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/astro-candles.js'
      - 'tests/astro-candles*.cjs'
      - '.github/workflows/astro-candles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and aggregation tests
        run: |
          node --check assets/astro-candles.js
          node tests/astro-candles.test.cjs
          node tests/astro-candles.integration.cjs
      - name: Regression existing Astrology News
        run: node tests/astro-news.test.cjs
