name: CEBONK Swing Berjanggut - verify and publish feed
on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'MQL5/**'
      - 'data/ea/swing-forecast-v2.schema.json'
      - 'ea/astro_swing_berjanggut/**'
      - 'scripts/*swing*'
      - 'scripts/swing/**'
      - 'tests/swing/**'
      - 'index.html'
      - 'assets/astro-killzone-core.js'
      - 'assets/astro-weekly-core.js'
      - 'assets/astro-swing-daily-core.js'
      - 'assets/mt5-broker-clock.js'
      - '.github/workflows/publish-swing-feed.yml'
  push:
    branches: [main]
    paths:
      - 'MQL5/**'
      - 'ea/astro_swing_berjanggut/**'
      - 'scripts/*swing*'
      - 'scripts/swing/**'
      - 'tests/swing/**'
      - 'data/ea/swing-forecast-v2.schema.json'
      - 'index.html'
      - 'assets/astro-killzone-core.js'
      - 'assets/astro-weekly-core.js'
      - 'assets/astro-swing-daily-core.js'
      - 'assets/mt5-broker-clock.js'
      - '.github/workflows/publish-swing-feed.yml'
permissions:
  contents: read
concurrency:
  group: cebonk-swing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --prefix ea/astro_swing_berjanggut --ignore-scripts --no-audit --no-fund
      - name: Feed and original weekly regressions
        run: |
          node --test tests/swing/*.test.mjs
          node tests/astro-weekly.test.cjs
      - name: Actual numeric and JSON/feed code on C++ host
        run: python3 scripts/test-swing-core.py
      - name: Browser UMD versus Node parity - 20 trading dates and DST
        run: node scripts/test-swing-parity.mjs
      - name: Source structure and complete current JSON
        run: |
          python3 scripts/check-swing-source.py
          node scripts/generate-swing-feed.mjs
          node scripts/check-swing-feed.mjs --file data/ea/swing-forecast-v2.json
      - name: Build source EA package
        run: python3 scripts/package-swing-ea.py
      - uses: actions/upload-artifact@v4
        with:
          name: CEBONK-SWING-BERJANGGUT-SOURCE-NOT-MT5-COMPILED
          path: |
            ea/astro_swing_berjanggut/dist/*.zip
            ea/astro_swing_berjanggut/evidence/
          if-no-files-found: error
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ea/astro_swing_berjanggut --ignore-scripts --no-audit --no-fund
      - name: Generate and validate atomically
        run: |
          git rev-parse HEAD > /tmp/cebonk-swing-base
          node scripts/generate-swing-feed.mjs
          node scripts/check-swing-feed.mjs --file data/ea/swing-forecast-v2.json
      - name: Commit only new v2 data with concurrent-source protection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ea/swing-forecast-v2.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish CEBONK swing forecast v2 [skip ci]'
            base=$(cat /tmp/cebonk-swing-base)
            git fetch origin main
            git diff --exit-code "$base" origin/main -- index.html assets/astro-killzone-core.js assets/astro-weekly-core.js assets/astro-swing-daily-core.js assets/mt5-broker-clock.js scripts/swing scripts/generate-swing-feed.mjs
            git rebase --onto origin/main "$base"
            git push origin HEAD:main
          fi
      - name: Request existing Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - name: Verify real Pages JSON and exact payload
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data/ea/swing-forecast-v2.json?run=${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-swing-feed.mjs --file data/ea/swing-forecast-v2.json --url "$url"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
