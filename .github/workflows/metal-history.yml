name: Historical metals & BaZi trend
on:
  push:
    branches: [main]
    paths:
      - 'assets/market-trend-*.js'
      - 'assets/bazi-ui.js'
      - 'tools/build-metals-history.py'
      - 'tests/market-trend.test.cjs'
      - 'index.html'
      - '.github/workflows/metal-history.yml'
  schedule:
    - cron: '40 5 * * 3'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metal-history-main
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript and historical trend rules
        run: |
          node --check assets/bazi-ui.js
          node --check assets/market-trend-core.js
          node --check assets/market-trend-ui.js
          node tests/market-trend.test.cjs
      - name: Install World Bank workbook reader
        run: python -m pip install 'openpyxl==3.1.5'
      - name: Refresh World Bank monthly metals history
        run: python tools/build-metals-history.py
      - name: Commit validated history when updated
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh World Bank monthly XAUUSD and XAGUSD benchmark archive"
            git push
          fi
