name: Al-Biruni panel checks
on:
  push:
    branches: [main]
    paths: ['assets/albiruni-*.js', 'assets/primbon-dagang*.js', 'assets/albiruni.css', 'tests/albiruni*.cjs', 'tests/primbon-dagang.test.cjs', 'tests/albiruni-three-horizon.test.cjs', 'tests/site-tab-router.test.cjs', 'tests/astrodox-audit.test.cjs', 'assets/astrodox-audit.js', 'assets/site-tab-router.js', 'index.html', 'ALBIRUNI_PANEL.md', '.github/workflows/albiruni-tests.yml']
  pull_request:
    paths: ['assets/albiruni-*.js', 'assets/primbon-dagang*.js', 'assets/albiruni.css', 'tests/albiruni*.cjs', 'tests/primbon-dagang.test.cjs', 'tests/albiruni-three-horizon.test.cjs', 'tests/site-tab-router.test.cjs', 'tests/astrodox-audit.test.cjs', 'assets/astrodox-audit.js', 'assets/site-tab-router.js', 'index.html', 'ALBIRUNI_PANEL.md', '.github/workflows/albiruni-tests.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts astronomy-engine@2.1.19 jsdom@26.1.0
      - run: node tests/albiruni.test.cjs
      - run: node tests/albiruni-classic.test.cjs
      - run: node tests/albiruni-election-gate.test.cjs
      - run: node tests/albiruni-ui.test.cjs
      - run: node tests/primbon-dagang.test.cjs
      - run: node tests/albiruni-three-horizon.test.cjs
      - run: node tests/site-tab-router.test.cjs
      - run: node tests/astrodox-audit.test.cjs
      - run: node tests/astro-weekly.test.cjs
