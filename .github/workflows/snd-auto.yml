name: Verify and install SND SNR Auto
on:
  push:
    branches: [main]
    paths:
      - 'assets/snd-auto-*.js'
      - 'tests/snd-auto*'
      - 'tools/install-snd-auto.cjs'
      - 'cloudflare-worker.js'
      - '.github/workflows/snd-auto.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: install-snd-auto
  cancel-in-progress: false
jobs:
  verify-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install guarded adapter and run deterministic regressions
        run: |
          sha256sum assets/musang-pdf-core.js assets/astro-news-v1.js > /tmp/preserved-sha
          node tools/install-snd-auto.cjs
          node tools/install-snd-auto.cjs
          sha256sum -c /tmp/preserved-sha
          node --check assets/snd-auto-core.js
          node --check assets/snd-auto-ui.js
          node tests/snd-auto.test.cjs
          node tests/snd-auto.integration.cjs
          node tests/musang-pdf.test.cjs
          node tests/astro-news.test.cjs
      - name: Test actual host mobile UI with synthetic data
        run: |
          npm install --prefix /tmp/cebonk-auto-test --no-save --package-lock=false --ignore-scripts playwright@1.55.1
          node /tmp/cebonk-auto-test/node_modules/playwright/cli.js install --with-deps chromium
          PLAYWRIGHT_MODULE=/tmp/cebonk-auto-test/node_modules/playwright node tests/snd-auto.browser.cjs
      - name: Read public Worker capabilities only - not a Cloudflare deployment
        run: |
          node - <<'NODE'
          (async()=>{try{const r=await fetch('https://cebonk-xau-api.enggarprasetiyo330.workers.dev/health',{signal:AbortSignal.timeout(12000)}),j=await r.json();console.log('LIVE_WORKER_CAPABILITIES',JSON.stringify({status:r.status,version:j.version||'legacy',htfEnabled:j.htfEnabled===true,secretConfigured:j.secretConfigured===true,intervals:j.intervals||[]}));}catch(e){console.log('LIVE_WORKER_UNVERIFIED',e.name);} })();
          NODE
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snd-auto-tests
          path: test-artifacts/
          if-no-files-found: ignore
      - name: Activate tested location scanner only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('SND_SNR_AUTO_README.md')
          p.write_text(p.read_text().replace("c eb onk-xau-api's Edit code (actual name: cebonk-xau-api)","cebonk-xau-api's Edit code"))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/musang-pdf-ui.js assets/snd-auto-core.js SND_SNR_AUTO_README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Activate automatic fresh-first SND SNR location scanner; preserve PDF and Astrology'
            git push origin HEAD:main
          fi
      - name: Request Pages build - Cloudflare still needs manual deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
