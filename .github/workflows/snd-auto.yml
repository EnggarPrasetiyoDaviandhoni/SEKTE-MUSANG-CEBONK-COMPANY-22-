name: Reconcile and verify SND SNR Auto
on:
  push:
    branches: [main]
    paths:
      - 'assets/snd-auto-core.js'
      - 'tests/snd-auto.test.cjs'
      - 'tools/reconcile-snd-auto.cjs'
      - '.github/workflows/snd-auto.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: install-snd-auto
  cancel-in-progress: false
jobs:
  verify-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reconcile with current automatic host and verify source integrity
        run: |
          git rev-parse HEAD > /tmp/reconcile-base
          sha256sum assets/astro-news-v1.js assets/musang-pdf-core.js worker/auto-sop-v3.mjs cloudflare-worker.js > /tmp/preserved-sha
          node tools/reconcile-snd-auto.cjs
          cp index.html /tmp/reconciled-once
          node tools/reconcile-snd-auto.cjs
          cmp index.html /tmp/reconciled-once
          sha256sum -c /tmp/preserved-sha
          node --check assets/snd-auto-core.js
          node --check assets/auto-combined-core.js
          node --check assets/auto-combined-ui.js
          node tests/snd-auto.test.cjs
          node tests/auto-combined.test.cjs
          node tests/auto-worker.test.mjs
          node tests/musang-pdf.test.cjs
          node tests/astro-news.test.cjs
      - name: Test actual three-tab host mobile UI and ephemeris
        run: |
          npm install --prefix /tmp/cebonk-auto-test --no-save --package-lock=false --ignore-scripts playwright@1.55.1 astronomy-engine@2.1.19
          /tmp/cebonk-auto-test/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/cebonk-auto-test/node_modules ASTRONOMY_MODULE=/tmp/cebonk-auto-test/node_modules/astronomy-engine node tests/astro-news.test.cjs
          NODE_PATH=/tmp/cebonk-auto-test/node_modules node tests/auto-combined.browser.cjs
      - name: Save verified mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snd-auto-reconciled-tests
          path: test-artifacts/
          if-no-files-found: ignore
      - name: Activate tested reconciliation without overwriting overlapping changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/auto-combined-core.js assets/auto-combined-ui.js assets/snd-auto-core.js tests/auto-combined.test.cjs tests/auto-combined.browser.cjs SOP_AUTO_COMBINED.md
          if ! git diff --cached --quiet; then
            git commit -m 'Reconcile auto SND SNR: FRESH first, no base patterns, retain simplified Combined and PDF entry'
            git fetch origin main
            base=$(cat /tmp/reconcile-base)
            if ! git diff --quiet "$base" origin/main -- index.html assets/auto-combined-core.js assets/auto-combined-ui.js assets/snd-auto-core.js tests/auto-combined.test.cjs tests/auto-combined.browser.cjs SOP_AUTO_COMBINED.md; then
              echo 'Overlapping source changed; stop instead of overwriting.'
              exit 1
            fi
            git rebase --onto origin/main "$base"
            git push origin HEAD:main
          fi
      - name: Request Pages build only - not Cloudflare deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
